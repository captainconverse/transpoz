<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab → Staff</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script src="tab-converter.js"></script>
<style>
.btn-export {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  padding: 0.3rem 0.7rem;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
.btn-export:hover:not(:disabled) { color: var(--gold); border-color: var(--gold); }
.btn-export:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>Tab <em>→</em> Staff</h1>
  <a class="nav-link" href="tab-converter.html">Tab → Tab</a>
  <a class="nav-link" href="home.html">← Staff → Tab</a>
</header>

<main>
  <!-- LEFT COLUMN: Tab input -->
  <div class="left-col">
    <div class="input-section">
      <div class="input-controls">
        <label>Input Tuning</label>
        <select id="inputTuningSelect" onchange="onInputTuningChange()">
          <optgroup label="Guitar">
            <option value="standard" selected>Guitar — Standard:  E A D G B e</option>
            <option value="dropD">Guitar — Drop D:  D A D G B e</option>
            <option value="openG">Guitar — Open G:  D G D G B D</option>
            <option value="openE">Guitar — Open E:  E B E G# B E</option>
            <option value="dadgad">Guitar — DADGAD:  D A D G A D</option>
            <option value="crowder">Guitar — Crowder:  E A E E B E</option>
          </optgroup>
          <optgroup label="Strings">
            <option value="violin">Violin:  G D A E</option>
            <option value="viola">Viola:  C G D A</option>
            <option value="cello">Cello:  C G D A</option>
          </optgroup>
        </select>
        <span class="sep"></span>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
        <button class="btn-convert" onclick="convertTab()" style="margin-left:auto">Convert →</button>
      </div>

      <textarea id="tabInput" spellcheck="false"
        placeholder="Paste or type guitar tab here in standard tuning.&#10;&#10;e|----------------|&#10;B|----------------|&#10;G|----------------|&#10;D|----------------|&#10;A|----------------|&#10;E|----------------|&#10;&#10;Multiple systems are supported — separate them with blank lines."
        oninput="onInputChange()"></textarea>

      <div class="parse-info" id="parseInfo">
        Beats: <span id="beatCount">—</span>
        &nbsp;·&nbsp; Strings detected: <span id="stringCount">—</span>
        &nbsp;·&nbsp; <span id="parseStatus">ready</span>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: Staff canvas -->
  <div class="right-col">
    <div class="staff-section">
      <div class="tab-header">
        <h2>Sheet Music Output</h2>
        <div class="transpose-controls">
          <label>Semitones</label>
          <button class="transpose-btn" onclick="adjustTranspose(-1)" title="Down 1 semitone">−</button>
          <div class="transpose-display" id="transposeDisplay"><span class="offset-zero">0</span></div>
          <button class="transpose-btn" onclick="adjustTranspose(1)" title="Up 1 semitone">+</button>
          <button class="transpose-reset" onclick="resetTranspose()">reset</button>
          <label style="margin-left:0.5rem">Octave</label>
          <button class="transpose-btn" onclick="adjustOctave(-1)" title="Down 1 octave">−</button>
          <div class="transpose-display" id="octaveDisplay"><span class="offset-zero">0</span></div>
          <button class="transpose-btn" onclick="adjustOctave(1)" title="Up 1 octave">+</button>
          <button class="transpose-reset" onclick="resetOctave()">reset</button>
          <span class="sep" style="margin-left:0.5rem"></span>
          <button class="btn-export" id="btnPng"   onclick="exportPNG()"   disabled title="Download as PNG">↓ PNG</button>
          <button class="btn-export" id="btnPrint" onclick="printScore()"  disabled title="Print / Save as PDF">⎙ Print</button>
        </div>
      </div>
      <div id="staffWrap" class="staff-canvas-wrap" style="min-height:180px;padding:0.5rem 0;">
        <span class="hint" id="staffHint">Paste tab on the left, then click Convert →</span>
        <canvas id="staffCanvas" style="display:none"></canvas>
      </div>
    </div>
  </div>
</main>

<div class="status-bar">
  <div>Tuning: <span id="statusInput">Standard</span></div>
  <div>Beats: <span id="statusBeats">—</span></div>
  <div>Duration: <span id="statusDuration">♩ quarter notes</span></div>
  <div>Transpose: <span id="statusTranspose">0 st</span></div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let transposeOffset = 0;
let octaveOffset    = 0;   // used by tab-converter.js adjustOctave/resetOctave
let inputTuningKey  = 'standard';
let parsedBeats     = [];
let parsedRowLengths = [];
let hasOutput       = false;

// ─── Tab Parsing (mirrors tab-converter.html) ────────────────────────────────
const TAB_LINE_RE = /^\s*([eEADGBbgd])\s*\|(.*)$/;

function parseTabInput(text) {
  const rawLines = text.split('\n');
  const blocks = [];
  let current = [];
  rawLines.forEach(raw => {
    const m = raw.match(TAB_LINE_RE);
    if (m) current.push({ name: m[1], content: m[2] });
    else {
      if (current.length >= 3) blocks.push(current);
      current = [];
    }
  });
  if (current.length >= 3) blocks.push(current);
  const allBeats = [], rowLengths = [];
  blocks.forEach(block => {
    const before = allBeats.length;
    parseBlock(block, allBeats);
    rowLengths.push(allBeats.length - before);
  });
  return { beats: allBeats, rowLengths };
}

function resolveStringIndex(name, posInBlock, blockLen, inputKey) {
  const numStrings = TUNING_OPEN[inputKey].length;
  const map6 = { e: 5, E: null, B: 4, b: 4, G: 3, g: 3, D: 2, d: 2, A: 1, a: 1 };
  if (numStrings === 4) return numStrings - 1 - posInBlock;
  const canonical = map6[name];
  if (canonical !== null && canonical !== undefined) return canonical;
  return posInBlock < blockLen / 2 ? 5 : 0;
}

function parseBlock(block, allBeats) {
  const inputKey   = inputTuningKey;
  const numStrings = TUNING_OPEN[inputKey].length;
  const lines = block.map((l, pos) => ({
    name: l.name, content: l.content,
    si: resolveStringIndex(l.name, pos, block.length, inputKey),
  }));
  const maxLen = Math.max(...lines.map(l => l.content.length), 0);
  const barCols = new Set();
  for (let col = 0; col < maxLen; col++) {
    if (lines.every(l => (l.content[col] || '') === '|')) barCols.add(col);
  }
  const beatCols = [];
  let col = 0;
  while (col < maxLen) {
    if (barCols.has(col)) { col++; continue; }
    const hasDigit = lines.some(l => /\d/.test(l.content[col] || ''));
    const hasX     = lines.some(l => (l.content[col] || '') === 'x');
    if (!hasDigit && !hasX) { col++; continue; }
    const pitches = new Array(numStrings).fill(null);
    let fretLen = 1;
    lines.forEach(l => {
      if (l.si < 0 || l.si >= numStrings) return;
      const ch = l.content[col] || '';
      if (ch === 'x' || !/\d/.test(ch)) return;
      let numStr = ch;
      const ch2 = l.content[col + 1] || '';
      if (/\d/.test(ch2)) { numStr += ch2; fretLen = Math.max(fretLen, 2); }
      pitches[l.si] = openPitch(inputKey, l.si) + parseInt(numStr, 10);
    });
    beatCols.push({ col, pitches, fretLen });
    col += fretLen;
  }
  beatCols.forEach((bc, i) => {
    let end = i + 1 < beatCols.length ? beatCols[i + 1].col : maxLen;
    while (end > bc.col + bc.fretLen && barCols.has(end - 1)) end--;
    bc.width = end - bc.col;
    if (i > 0) {
      const prevEnd = beatCols[i - 1].col + beatCols[i - 1].fretLen;
      bc.barBefore = false;
      for (let c = prevEnd; c < bc.col; c++) {
        if (barCols.has(c)) { bc.barBefore = true; break; }
      }
    } else {
      bc.barBefore = false;
    }
  });
  beatCols.forEach(bc => allBeats.push({ pitches: bc.pitches, barBefore: bc.barBefore, width: bc.width }));
}

// ─── Controls ────────────────────────────────────────────────────────────────
function refreshOutput() {
  if (hasOutput) renderStaff(parsedBeats, transposeOffset + octaveOffset * 12);
}

function adjustTranspose(delta) {
  transposeOffset = Math.max(-24, Math.min(24, transposeOffset + delta));
  const el = document.getElementById('transposeDisplay');
  if (transposeOffset === 0) {
    el.innerHTML = '<span class="offset-zero">0</span>';
  } else {
    const arrow = transposeOffset > 0 ? '↑' : '↓';
    const sign  = transposeOffset > 0 ? '+' : '';
    el.innerHTML = `<span class="offset-val">${arrow}${Math.abs(transposeOffset)} st &nbsp;(${sign}${transposeOffset})</span>`;
  }
  document.getElementById('statusTranspose').textContent = (transposeOffset + octaveOffset * 12) + ' st';
  if (hasOutput) renderStaff(parsedBeats, transposeOffset + octaveOffset * 12);
}

function resetTranspose() {
  transposeOffset = 0;
  document.getElementById('transposeDisplay').innerHTML = '<span class="offset-zero">0</span>';
  document.getElementById('statusTranspose').textContent = octaveOffset * 12 + ' st';
  if (hasOutput) renderStaff(parsedBeats, transposeOffset + octaveOffset * 12);
}

function onInputTuningChange() {
  inputTuningKey = document.getElementById('inputTuningSelect').value;
  document.getElementById('statusInput').textContent = TUNING_LABEL[inputTuningKey];
  onInputChange();
}

function onInputChange() {
  const text = document.getElementById('tabInput').value;
  if (!text.trim()) {
    document.getElementById('beatCount').textContent = '—';
    document.getElementById('stringCount').textContent = '—';
    document.getElementById('parseStatus').innerHTML = 'ready';
    parsedBeats = [];
    return;
  }
  try {
    const { beats, rowLengths } = parseTabInput(text);
    parsedBeats     = beats;
    parsedRowLengths = rowLengths;
    const seenStrings = new Set();
    beats.forEach(b => b.pitches.forEach((p, si) => { if (p !== null) seenStrings.add(si); }));
    document.getElementById('beatCount').textContent   = beats.length;
    document.getElementById('stringCount').textContent = seenStrings.size;
    document.getElementById('parseStatus').innerHTML   =
      beats.length > 0
        ? '<span class="ok">✓ parsed</span>'
        : '<span class="err">no beats found — check format</span>';
  } catch (e) {
    document.getElementById('parseStatus').innerHTML = '<span class="err">parse error</span>';
  }
}

function convertTab() {
  onInputChange();
  if (parsedBeats.length) {
    document.getElementById('staffHint').style.display   = 'none';
    document.getElementById('staffCanvas').style.display = 'block';
    renderStaff(parsedBeats, transposeOffset + octaveOffset * 12);
    document.getElementById('statusBeats').textContent = parsedBeats.length;
    hasOutput = true;
    document.getElementById('btnPng').disabled   = false;
    document.getElementById('btnPrint').disabled = false;
  }
}

function clearAll() {
  document.getElementById('tabInput').value             = '';
  document.getElementById('beatCount').textContent      = '—';
  document.getElementById('stringCount').textContent    = '—';
  document.getElementById('parseStatus').innerHTML      = 'ready';
  document.getElementById('statusBeats').textContent    = '—';
  document.getElementById('staffHint').style.display    = '';
  document.getElementById('staffCanvas').style.display  = 'none';
  const cnv = document.getElementById('staffCanvas');
  cnv.getContext('2d').clearRect(0, 0, cnv.width, cnv.height);
  parsedBeats      = [];
  parsedRowLengths = [];
  hasOutput        = false;
  document.getElementById('btnPng').disabled   = true;
  document.getElementById('btnPrint').disabled = true;
}

// ─── Export helpers ───────────────────────────────────────────────────────────
// Re-renders the score with print-friendly colours onto a fresh canvas element
// (transparent background) and returns it. Caller composites a background on top.
function buildPrintCanvas() {
  const src = document.getElementById('staffCanvas');
  const dpr = window.devicePixelRatio || 1;
  const W   = src.width / dpr;
  const out = document.createElement('canvas');
  renderStaffToCtx(out, parsedBeats, transposeOffset + octaveOffset * 12, W,
                   '#1a1408', 'rgba(40,25,5,0.6)', '#7a5a10');
  return { canvas: out, W, H: out.height / dpr, dpr };
}

function exportPNG() {
  if (!hasOutput) return;
  const { canvas: score, W, H, dpr } = buildPrintCanvas();

  // Composite score (transparent bg) onto cream paper
  const out = document.createElement('canvas');
  out.width  = score.width;
  out.height = score.height;
  const ctx  = out.getContext('2d');
  ctx.fillStyle = '#f8f4eb';
  ctx.fillRect(0, 0, score.width, score.height);
  ctx.drawImage(score, 0, 0);

  const a    = document.createElement('a');
  a.href     = out.toDataURL('image/png');
  a.download = 'sheet-music.png';
  a.click();
}

function printScore() {
  if (!hasOutput) return;
  const { canvas: score, W, H, dpr } = buildPrintCanvas();

  // Composite score onto white
  const out = document.createElement('canvas');
  out.width  = score.width;
  out.height = score.height;
  const ctx  = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, score.width, score.height);
  ctx.drawImage(score, 0, 0);

  const url = out.toDataURL('image/png');
  const win = window.open('', '_blank',
    `width=${Math.min(W + 80, 1200)},height=${Math.min(H + 120, 900)}`);
  win.document.write(`<!DOCTYPE html><html><head>
<title>Sheet Music</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; display:flex; flex-direction:column;
         align-items:center; padding:24px; font-family:sans-serif; }
  img  { max-width:100%; height:auto; display:block; }
  @media print {
    body { padding:0; }
    .no-print { display:none; }
    img { width:100%; }
  }
</style>
</head><body>
<p class="no-print" style="font-size:13px;color:#888;margin-bottom:14px;">
  Use your browser's print dialog — choose "Save as PDF" to export.
</p>
<img src="${url}" width="${W}" height="${H}">
<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>
</body></html>`);
  win.document.close();
}

// ─── Pitch → Staff Step ───────────────────────────────────────────────────────
// Staff step 0 = E4 (bottom line of treble clef).
// Each diatonic step up = +1. Even steps sit on lines, odd steps in spaces.
// Bass clef lines: G2(−12) B2(−10) D3(−8) F3(−6) A3(−4). Top line A3 = step −4.
// Grand staff gap: treble bottom E4 (step 0) to bass top A3 (step −4) = 2*LS gap.
const SEMI_TO_NOTE = [
  {dia:0, acc:''},   // 0  C
  {dia:0, acc:'#'},  // 1  C#
  {dia:1, acc:''},   // 2  D
  {dia:1, acc:'#'},  // 3  D#
  {dia:2, acc:''},   // 4  E
  {dia:3, acc:''},   // 5  F
  {dia:3, acc:'#'},  // 6  F#
  {dia:4, acc:''},   // 7  G
  {dia:4, acc:'#'},  // 8  G#
  {dia:5, acc:''},   // 9  A
  {dia:5, acc:'#'},  // 10 A#
  {dia:6, acc:''},   // 11 B
];
const E4_DIA_POS = 4 * 7 + 2; // diatonic position of E4 from C0

function pitchToStep(pitch) {
  const oct  = Math.floor(pitch / 12);
  const semi = pitch - oct * 12;
  const { dia, acc } = SEMI_TO_NOTE[semi];
  return { step: oct * 7 + dia - E4_DIA_POS, acc };
}

// Ledger lines for treble staff: middle C (−2) and above-staff lines (≥10).
function trebleLedgers(step) {
  const lines = [];
  if (step <= -2) lines.push(-2); // middle C ledger (also covers D4 just above it)
  if (step >= 10) {
    const outer = step % 2 === 0 ? step : step - 1;
    for (let s = 10; s <= outer; s += 2) lines.push(s);
  }
  return lines;
}

// Ledger lines for bass staff: below G2 (step ≤ −14).
function bassLedgers(step) {
  const lines = [];
  if (step <= -14) {
    const outer = step % 2 === 0 ? step : step + 1; // nearest even toward −12
    for (let s = -14; s >= outer; s -= 2) lines.push(s);
  }
  return lines;
}

// ─── Grand Staff Rendering ────────────────────────────────────────────────────
const LS        = 11;        // pixels between adjacent staff lines
const NH_W      = LS * 0.95; // note head semi-major axis
const NH_H      = LS * 0.64; // note head semi-minor axis
const STEM_LEN  = LS * 3.5;  // quarter note stem length
const STAFF_H   = LS * 4;    // distance from bottom to top of one 5-line staff
const GRAND_GAP = LS * 2;    // gap between treble bottom (E4) and bass top (A3)
const SYS_GAP   = LS * 8;    // vertical gap between systems
const CLEF_W    = 44;        // horizontal space reserved for clefs
const BEAT_W    = 46;        // horizontal space per beat
const L_MARGIN  = 32;
const R_MARGIN  = 24;

// Notes at step >= TREBLE_SPLIT → treble; below → bass
const TREBLE_SPLIT = -2; // C4 and above → treble, B3 and below → bass
const TREBLE_MID   =  4; // B4, middle line of treble staff
const BASS_MID     = -8; // D3, middle line of bass staff

// Default screen palette
const C_INK   = '#ddd8c8';
const C_STAFF = 'rgba(220,210,180,0.55)';
const C_GOLD  = '#c8a84b';

// renderStaffToCtx: sizes `canvas`, draws the grand staff onto it.
// cInk/cStaff/cGold let callers swap in a print palette.
function renderStaffToCtx(canvas, beats, semitoneOffset, W, cInk, cStaff, cGold) {
  const dpr = window.devicePixelRatio || 1;

  // Split each beat's pitches into treble and bass groups
  const beatNotes = beats.map(beat => {
    const treble = [], bass = [];
    beat.pitches.forEach(p => {
      if (p === null) return;
      const { step, acc } = pitchToStep(p + semitoneOffset);
      (step >= TREBLE_SPLIT ? treble : bass).push({ step, acc });
    });
    return { treble, bass, barBefore: beat.barBefore };
  });

  // Dynamic vertical padding based on note range
  let maxTreble = 8, minBass = -12;
  beatNotes.forEach(bn => {
    bn.treble.forEach(n => { if (n.step > maxTreble) maxTreble = n.step; });
    bn.bass.forEach(n =>   { if (n.step < minBass)   minBass   = n.step; });
  });
  const PAD_TOP = Math.max(LS * 4, (maxTreble - 8)   * (LS / 2) + LS * 4);
  const PAD_BOT = Math.max(LS * 4, (-minBass  - 12)  * (LS / 2) + LS * 4);

  // Offsets from sysTop:
  //   treble bottom (E4) = PAD_TOP + STAFF_H
  //   bass top (A3)      = treble bottom + GRAND_GAP
  //   bass bottom (G2)   = bass top + STAFF_H = treble bottom + GRAND_GAP + STAFF_H
  const TREBLE_BOT_OFF = PAD_TOP + STAFF_H;
  const BASS_BOT_OFF   = TREBLE_BOT_OFF + GRAND_GAP + STAFF_H;
  const SYS_H          = BASS_BOT_OFF + PAD_BOT;

  const availW      = W - L_MARGIN - CLEF_W - R_MARGIN;
  const beatsPerSys = Math.max(4, Math.floor(availW / BEAT_W));

  const systems = [];
  for (let i = 0; i < beatNotes.length; i += beatsPerSys) {
    systems.push(beatNotes.slice(i, i + beatsPerSys));
  }
  if (!systems.length) return;

  const totalH = systems.length * (SYS_H + SYS_GAP) - SYS_GAP + 28;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(totalH * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = totalH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, totalH);

  systems.forEach((sys, si) => {
    const sysTop      = si * (SYS_H + SYS_GAP) + 14;
    const trebleBotY  = sysTop + TREBLE_BOT_OFF;
    const trebleTopY  = trebleBotY - STAFF_H;
    const bassBotY    = sysTop + BASS_BOT_OFF;
    const bassTopY    = bassBotY - STAFF_H; // = trebleBotY + GRAND_GAP

    // Unified Y: both staves share the same diatonic coordinate origin (E4 = trebleBotY)
    function noteY(step) { return trebleBotY - step * (LS / 2); }

    // ── Treble staff lines ──
    ctx.strokeStyle = cStaff;
    ctx.lineWidth   = 0.9;
    for (let i = 0; i <= 4; i++) {
      const y = trebleBotY - i * LS;
      ctx.beginPath();
      ctx.moveTo(L_MARGIN, y);
      ctx.lineTo(W - R_MARGIN, y);
      ctx.stroke();
    }

    // ── Bass staff lines ──
    for (let i = 0; i <= 4; i++) {
      const y = bassBotY - i * LS;
      ctx.beginPath();
      ctx.moveTo(L_MARGIN, y);
      ctx.lineTo(W - R_MARGIN, y);
      ctx.stroke();
    }

    // ── Left bracket connecting both staves ──
    const bkX = L_MARGIN - 6;
    ctx.strokeStyle = cInk;
    ctx.lineWidth   = 2.5;
    ctx.beginPath();
    ctx.moveTo(bkX, trebleTopY);
    ctx.lineTo(bkX, bassBotY);
    ctx.stroke();
    ctx.lineWidth = 2;
    [[bkX - 3, bkX + 3, trebleTopY], [bkX - 3, bkX + 3, bassBotY]].forEach(([x0, x1, y]) => {
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    });

    // ── Opening barline spanning both staves ──
    ctx.strokeStyle = cInk;
    ctx.lineWidth   = 1.3;
    ctx.beginPath();
    ctx.moveTo(L_MARGIN, trebleTopY);
    ctx.lineTo(L_MARGIN, bassBotY);
    ctx.stroke();

    // ── Treble clef ──
    ctx.fillStyle    = cInk;
    ctx.font         = `${LS * 8}px serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('𝄞', L_MARGIN + 2, trebleBotY + LS * 1.9);

    // ── Bass clef ──
    ctx.font         = `${LS * 4}px serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('𝄢', L_MARGIN + 3, bassBotY + LS * 0.4);

    // ── Notes helper ──
    function drawGroup(group, midLine, ledgerFn) {
      if (!group.length) return;
      const sorted  = [...group].sort((a, b) => a.step - b.step);
      const avg     = sorted.reduce((s, n) => s + n.step, 0) / sorted.length;
      const stemUp  = avg <= midLine;
      const base    = stemUp ? sorted[0] : sorted[sorted.length - 1];
      const baseY   = noteY(base.step);
      const tipY    = stemUp ? baseY - STEM_LEN : baseY + STEM_LEN;
      const stemX   = stemUp ? beatX + NH_W / 2 - 1.5 : beatX - NH_W / 2 + 1.5;

      ctx.strokeStyle = cInk;
      ctx.lineWidth   = 1.2;
      ctx.beginPath();
      ctx.moveTo(stemX, baseY);
      ctx.lineTo(stemX, tipY);
      ctx.stroke();

      sorted.forEach(n => {
        const ny = noteY(n.step);

        // Ledger lines
        const ledgers = ledgerFn(n.step);
        if (ledgers.length) {
          ctx.strokeStyle = cStaff;
          ctx.lineWidth   = 0.9;
          ledgers.forEach(ls => {
            const ly = noteY(ls);
            ctx.beginPath();
            ctx.moveTo(beatX - NH_W * 0.95, ly);
            ctx.lineTo(beatX + NH_W * 0.95, ly);
            ctx.stroke();
          });
        }

        // Accidental
        if (n.acc) {
          ctx.fillStyle    = cGold;
          ctx.font         = `${LS * 1.35}px serif`;
          ctx.textBaseline = 'middle';
          ctx.fillText(n.acc === '#' ? '♯' : '♭', beatX - NH_W * 1.6, ny);
        }

        // Notehead — filled, slightly tilted ellipse
        ctx.fillStyle = cInk;
        ctx.save();
        ctx.translate(beatX, ny);
        ctx.rotate(-0.18);
        ctx.beginPath();
        ctx.ellipse(0, 0, NH_W / 2, NH_H / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // ── Notes + beat barlines ──
    let beatX = L_MARGIN + CLEF_W;

    sys.forEach((beat, bi) => {
      if (bi > 0 && beat.barBefore) {
        const bx = beatX - BEAT_W * 0.38;
        ctx.strokeStyle = cInk;
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(bx, trebleTopY);
        ctx.lineTo(bx, bassBotY);
        ctx.stroke();
      }

      drawGroup(beat.treble, TREBLE_MID, trebleLedgers);
      drawGroup(beat.bass,   BASS_MID,   bassLedgers);

      beatX += BEAT_W;
    });

    // ── Closing barline spanning both staves ──
    ctx.strokeStyle = cInk;
    ctx.lineWidth   = 1.3;
    ctx.beginPath();
    ctx.moveTo(W - R_MARGIN, trebleTopY);
    ctx.lineTo(W - R_MARGIN, bassBotY);
    ctx.stroke();
  });
}

// Thin wrapper: sizes the on-screen canvas then draws with the dark UI palette.
function renderStaff(beats, semitoneOffset) {
  const canvas = document.getElementById('staffCanvas');
  const W      = Math.max(document.getElementById('staffWrap').clientWidth || 700, 400);
  renderStaffToCtx(canvas, beats, semitoneOffset, W, C_INK, C_STAFF, C_GOLD);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.getElementById('statusInput').textContent = TUNING_LABEL[inputTuningKey];
</script>
